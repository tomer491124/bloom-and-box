<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom &amp; Box — זרי פרחים ומארזי מתנה יוקרתיים בתל אביב</title>
<meta name="description" content="Bloom &amp; Box — סטודיו בוטני בתל אביב. זרי פרחים בעבודת יד ומארזי מתנה יוקרתיים, משלוח עוד היום בגוש דן והשרון או איסוף עצמי.">
<meta property="og:title" content="Bloom &amp; Box — The Art of Luxury Floral">
<meta property="og:description" content="זרי פרחים בעבודת יד ומארזי מתנה יוקרתיים. משלוח עוד היום בגוש דן והשרון.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1F3D2B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Frank+Ruhl+Libre:wght@300;400;500&amp;family=Heebo:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAFA}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
a{color:#1E3A2B}a:hover{color:#7E6318}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:1.5px solid #B8941F;outline-offset:3px}
.serif{font-family:'Cormorant Garamond','Frank Ruhl Libre',serif;font-weight:300}
.bb-eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#7E6318}
.bb-eyebrow::before{content:'';width:28px;height:1px;background:#D4AF37}

.bb-header{position:sticky;top:0;z-index:30;background:rgba(250,250,250,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid rgba(26,31,27,.07)}
.bb-nav a{position:relative;text-decoration:none;color:#24402F;font-size:14px;letter-spacing:.06em;padding:8px 0}
.bb-nav a::after{content:'';position:absolute;right:0;bottom:2px;height:1px;width:0;background:#B8941F;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bb-nav a:hover{color:#1E3A2B}.bb-nav a:hover::after{width:100%}

.bb-logo{display:inline-flex;align-items:center;gap:14px;min-height:48px;text-decoration:none;color:#1E3A2B}
.bb-logo:hover{color:#1E3A2B}
.bb-mark{width:48px;height:54px;flex:none;overflow:visible;transition:transform 1s cubic-bezier(.22,1,.36,1),filter 1s ease}
.bb-ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:0;animation:bbDraw 2.2s cubic-bezier(.65,0,.35,1) both}
.bb-sway,.bb-halo,.bb-daisy{transform-box:view-box;transition:transform 1.6s cubic-bezier(.22,1,.36,1)}
.bb-sway-l{transform-origin:31.5px 38px}.bb-sway-r{transform-origin:32.5px 38px}.bb-sway-c{transform-origin:32px 38px}
.bb-halo{transform-origin:32px 13px;animation:bbFade 1.4s ease 1.6s both}
.bb-daisy{transform-origin:21px 19.5px}
.bb-text{display:flex;flex-direction:column;gap:7px;animation:bbFade 1.2s ease .6s both}
.bb-word{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:31px;line-height:1;letter-spacing:.14em;color:#1E3A2B;transition:text-shadow 1s ease}
.bb-amp{display:inline-block;width:.66em;height:.8em;margin:0 .24em 0 .12em;vertical-align:-.04em;color:#B8941F;transition:filter 1s ease}
.bb-amp svg{display:block;width:100%;height:100%;overflow:visible}
.bb-logo:hover .bb-amp,.bb-logo.is-hover .bb-amp{filter:drop-shadow(0 0 6px rgba(212,175,55,.6))}
.bb-tag{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.42em;color:#7E6318;white-space:nowrap}
.bb-rule{width:14px;height:1px;background:#D4AF37;transition:width 1s cubic-bezier(.22,1,.36,1)}
.bb-logo:hover .bb-mark,.bb-logo.is-hover .bb-mark,.bb-logo:focus-visible .bb-mark{transform:translateY(-3px);filter:drop-shadow(0 0 3px rgba(212,175,55,.55)) drop-shadow(0 6px 16px rgba(212,175,55,.38))}
.bb-logo:hover .bb-word,.bb-logo.is-hover .bb-word{text-shadow:0 0 22px rgba(212,175,55,.38)}
.bb-logo:hover .bb-rule,.bb-logo.is-hover .bb-rule{width:26px}
.bb-logo:hover .bb-sway-l,.bb-logo.is-hover .bb-sway-l{transform:rotate(-5deg)}
.bb-logo:hover .bb-sway-r,.bb-logo.is-hover .bb-sway-r{transform:rotate(5deg)}
.bb-logo:hover .bb-sway-c,.bb-logo.is-hover .bb-sway-c{transform:rotate(-1.5deg)}
.bb-logo:hover .bb-halo,.bb-logo.is-hover .bb-halo{transform:rotate(45deg)}
.bb-logo:hover .bb-daisy,.bb-logo.is-hover .bb-daisy{transform:rotate(60deg)}

.bb-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 34px;border:0;border-radius:2px;background:linear-gradient(120deg,#1F3D2B 0%,#356B4C 45%,#1F3D2B 100%);background-size:220% 100%;background-position:100% 0;color:#FAFAFA;font-size:15px;font-weight:400;letter-spacing:.08em;text-decoration:none;white-space:nowrap;box-shadow:0 14px 34px -14px rgba(27,36,30,.55),0 2px 6px rgba(27,36,30,.1),inset 0 0 0 1px rgba(212,175,55,0);transition:background-position 1s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),box-shadow .6s ease}
.bb-btn:hover{color:#FAFAFA;background-position:0 0;transform:translateY(-2px);box-shadow:0 24px 46px -16px rgba(27,36,30,.6),0 4px 10px rgba(27,36,30,.1),inset 0 0 0 1px rgba(212,175,55,.6)}
.bb-btn:active{transform:translateY(0)}
.bb-btn:disabled{background:#D5D7D3;color:#3A3F3B;box-shadow:none;transform:none}
.bb-btn.is-added{background:linear-gradient(120deg,#6E5612,#9C7A1E);box-shadow:0 14px 34px -14px rgba(126,99,24,.6)}
.bb-btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 34px;border-radius:2px;border:1px solid rgba(26,31,27,.35);background:transparent;color:#1E3A2B;font-size:15px;letter-spacing:.08em;text-decoration:none;white-space:nowrap;transition:all .6s cubic-bezier(.22,1,.36,1)}
.bb-btn-ghost:hover{color:#1E3A2B;border-color:#B8941F;background:rgba(212,175,55,.07);transform:translateY(-2px)}
.bb-btn-sm{min-height:46px;padding:0 22px;font-size:14px}

.bb-pill{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid #DEDBD3;background:#FFFFFF;color:#24402F;font-size:14px;letter-spacing:.04em;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .5s cubic-bezier(.22,1,.36,1)}
.bb-pill:hover{border-color:#B8941F;transform:translateY(-1px)}
.bb-pill.is-on{background:linear-gradient(120deg,#1F3D2B,#356B4C);color:#FAFAFA;border-color:transparent;box-shadow:0 12px 26px -12px rgba(27,36,30,.6)}
.bb-pill.sm{min-height:38px;padding:0 16px;font-size:13px}
.bb-pill.gold{background:transparent;border-style:dashed}
.bb-pill.gold.is-on{background:#FFFFFF;color:#1E3A2B;border:1px solid #B8941F;box-shadow:0 0 0 4px rgba(212,175,55,.14)}

.bb-in-a{animation:bbInA .9s cubic-bezier(.22,1,.36,1) both}
.bb-in-b{animation:bbInB .9s cubic-bezier(.22,1,.36,1) both}
.bb-card{height:100%;display:flex;flex-direction:column;background:#FFFFFF;border-radius:4px;overflow:hidden;box-shadow:0 30px 60px -38px rgba(27,36,30,.38),0 1px 2px rgba(27,36,30,.04);transition:transform .8s cubic-bezier(.22,1,.36,1),box-shadow .8s ease}
.bb-card:hover{transform:translateY(-8px);box-shadow:0 46px 80px -40px rgba(27,36,30,.45),0 2px 4px rgba(27,36,30,.05)}
.bb-card .bb-art{transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.bb-card:hover .bb-art{transform:scale(1.06)}
.bb-chip{font-size:12px;padding:3px 10px;border-radius:999px;background:#F3F1EC;color:#3F5A48}

.bb-opt{text-align:right;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:4px;border:1px solid #E4E1DA;background:#FFFFFF;color:#1E3A2B;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .5s cubic-bezier(.22,1,.36,1)}
.bb-opt:hover{border-color:#B8941F;transform:translateY(-2px);box-shadow:0 18px 32px -22px rgba(27,36,30,.4)}
.bb-opt.is-on{border-color:#1E3A2B;box-shadow:0 0 0 1px #1E3A2B,0 20px 36px -22px rgba(27,36,30,.45)}
.bb-opt.is-blocked{opacity:.45}
.bb-opt.row{flex-direction:row;justify-content:space-between;align-items:center;min-height:64px}

.bb-cartbtn{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid rgba(26,31,27,.14);background:#FFFFFF;color:#1E3A2B;font-size:14px;letter-spacing:.06em;box-shadow:0 12px 26px -18px rgba(27,36,30,.4);transition:all .5s cubic-bezier(.22,1,.36,1)}
.bb-cartbtn:hover{border-color:#B8941F;transform:translateY(-1px)}
.bb-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:linear-gradient(135deg,#ECD27A,#C9A532);color:#1E3A2B;font-size:12px;font-weight:600;box-shadow:0 4px 12px -4px rgba(184,148,31,.75)}
.bump-a{animation:bbBumpA .7s cubic-bezier(.34,1.56,.64,1)}
.bump-b{animation:bbBumpB .7s cubic-bezier(.34,1.56,.64,1)}

.bb-overlay{position:fixed;inset:0;z-index:40;background:rgba(20,26,22,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s ease}
.bb-overlay.is-open{opacity:1;pointer-events:auto}
.bb-drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(460px,100%);background:#FAFAFA;display:flex;flex-direction:column;overflow-y:auto;box-shadow:30px 0 90px -30px rgba(20,26,22,.5);transform:translateX(-104%);visibility:hidden;transition:transform .75s cubic-bezier(.22,1,.36,1),visibility 0s linear .75s}
.bb-drawer.is-open{transform:none;visibility:visible;transition:transform .75s cubic-bezier(.22,1,.36,1),visibility 0s}
.bb-line{animation:bbInA .6s cubic-bezier(.22,1,.36,1) both}
.bb-qty{width:32px;height:32px;border-radius:999px;border:1px solid #D9D6CF;background:#FFFFFF;color:#1E3A2B;font-size:16px;transition:border-color .4s ease}
.bb-qty:hover{border-color:#B8941F}

.bb-toast{position:fixed;left:50%;bottom:28px;z-index:35;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 22px;border-radius:999px;background:linear-gradient(120deg,#1F3D2B,#356B4C);color:#FAFAFA;font-size:14px;box-shadow:0 24px 50px -20px rgba(20,26,22,.65);opacity:0;pointer-events:none;transform:translate(-50%,24px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.bb-toast.is-show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.bb-toast button{min-height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(212,175,55,.7);background:transparent;color:#ECD27A;font-size:13px;letter-spacing:.06em}

.bb-foot a{color:#E7E4DC;text-decoration:none}.bb-foot a:hover{color:#ECD27A}

@keyframes bbDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes bbFade{from{opacity:0}to{opacity:1}}
@keyframes bbInA{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bbInB{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bbBumpA{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes bbBumpB{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes bbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bb-float{animation:bbFloat 7s ease-in-out infinite}
@media (max-width:640px){.bb-tag{display:none}.bb-word{font-size:24px;letter-spacing:.1em}.bb-mark{width:40px;height:46px}.bb-nav{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
